[build-system]
requires = ["setuptools>=77"]               # license as an SPDX expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "jlcplace"
version = "0.2.0"
description = "Check and correct JLCPCB pick-and-place (CPL) files for KiCad boards by simulating JLC's placement with its own EasyEDA footprints"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tyevco" }]
dependencies = ["numpy>=1.22"]
keywords = ["kicad", "jlcpcb", "pick-and-place", "cpl", "pcb", "assembly", "easyeda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/tyevco/jlcplace"
Repository = "https://github.com/tyevco/jlcplace"
Issues = "https://github.com/tyevco/jlcplace/issues"

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6", "pyyaml>=5.1"]

[project.scripts]
jlcplace = "jlcplace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pcbnew: needs KiCad's pcbnew Python module",
    "cache: needs EasyEDA records in the local cache (run `jlcplace fetch` first)",
    "network: talks to the EasyEDA API",
    "claude: needs the Claude Code CLI (claude) on PATH: the plugin marketplace's `claude plugin validate`",
]
# with `python -X warn_default_encoding` (CI does), text I/O that depends on the locale fails here, not only on Windows
filterwarnings = ["error::EncodingWarning:(jlcplace|test_)"]
