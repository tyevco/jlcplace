[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jlcplace"
version = "0.1.0"
description = "Check and correct JLCPCB pick-and-place (CPL) files for KiCad boards by simulating JLC's placement with its own EasyEDA footprints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]
keywords = ["kicad", "jlcpcb", "pick-and-place", "cpl", "pcb", "assembly", "easyeda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]

[project.scripts]
jlcplace = "jlcplace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pcbnew: needs KiCad's pcbnew Python module",
    "cache: needs EasyEDA records in the local cache (run `jlcplace fetch` first)",
    "network: talks to the EasyEDA API",
]
