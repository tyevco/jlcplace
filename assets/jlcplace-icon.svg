<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23804d"/>
      <stop offset="1" stop-color="#145234"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27c"/>
      <stop offset="1" stop-color="#d9a93f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="210" fill="url(#board)"/>
  <!-- copper traces -->
  <g stroke="#e8c26a" stroke-opacity="0.28" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 330 V210 H150"/>
    <path d="M512 330 V150"/>
    <path d="M706 330 V230 H880"/>
    <path d="M318 694 V820 H170"/>
    <path d="M706 694 V860"/>
  </g>
  <circle cx="150" cy="210" r="26" fill="#e8c26a" fill-opacity="0.35"/>
  <circle cx="880" cy="230" r="26" fill="#e8c26a" fill-opacity="0.35"/>
  <circle cx="170" cy="820" r="26" fill="#e8c26a" fill-opacity="0.35"/>
  <!-- package body (silk outline) -->
  <rect x="240" y="400" width="544" height="224" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10"/>
  <circle cx="282" cy="586" r="14" fill="#ffffff" fill-opacity="0.75"/>
  <!-- KiCad copper pads -->
  <g fill="url(#pad)">
    <rect x="258" y="270" width="120" height="150" rx="18"/>
    <rect x="452" y="270" width="120" height="150" rx="18"/>
    <rect x="646" y="270" width="120" height="150" rx="18"/>
    <rect x="258" y="604" width="120" height="150" rx="18"/>
    <rect x="452" y="604" width="120" height="150" rx="18"/>
    <rect x="646" y="604" width="120" height="150" rx="18"/>
  </g>
  <!-- JLC's EasyEDA pads, placed: dashed outlines on the copper -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-dasharray="26 16" stroke-linecap="round">
    <rect x="246" y="258" width="144" height="174" rx="24"/>
    <rect x="440" y="258" width="144" height="174" rx="24"/>
    <rect x="634" y="258" width="144" height="174" rx="24"/>
    <rect x="246" y="592" width="144" height="174" rx="24"/>
    <rect x="440" y="592" width="144" height="174" rx="24"/>
    <rect x="634" y="592" width="144" height="174" rx="24"/>
  </g>
  <!-- check badge -->
  <circle cx="836" cy="836" r="128" fill="#ffffff"/>
  <circle cx="836" cy="836" r="128" fill="none" stroke="#145234" stroke-opacity="0.15" stroke-width="8"/>
  <path d="M775 840 L821 886 L903 790" fill="none" stroke="#1f6f43" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
